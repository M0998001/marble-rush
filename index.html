function circleCollision(b,x,z,r,impulse=1){let dx=b.x-x,dz=b.z-z,d2=dx*dx+dz*dz,min=b.r+r;if(d2>=min*min)return false;let d=Math.sqrt(Math.max(d2,.0001)),nx=dx/d,nz=dz/d,overlap=min-d;b.x+=nx*overlap*1.03;b.z+=nz*overlap*1.03;let vn=b.vx*nx+b.vz*nz;if(vn<0){b.hitCount=(b.hitCount||0)+1;b.vx-=(1.4*impulse)*vn*nx;b.vz-=(1.4*impulse)*vn*nz;b.bounce=Math.min(.7,b.bounce+.12)}return true}

function seedNow(){return ((Date.now()>>>0)^(Math.random()*4294967295>>>0))>>>0}
function makeDemo(){state.demoSeed=seedNow();state.world=createWorld('funnel',state.demoSeed,'standard',state.players.slice(0,6));state.simMode='demo';state.selectedFollow=null;renderer.setMode('auto');state.running=true;state.started=true;state.paused=false}
function racePreview(){if(state.mode==='teams'&&!Array.from({length:state.teams},(_,t)=>state.players.slice(0,state.count).some(p=>p.team%state.teams===t)).every(Boolean)){toast('Assign at least one player to each team.');return}let c=state.mode==='pachinko'?'pachinko':save.unlockedCourses.includes(state.course)?state.course:'pegboard';state.world=createWorld(c,seedNow(),state.length,state.players.slice(0,state.count).map((p,i)=>({...p,team:p.team%state.teams})));state.simMode='preview';state.started=false;state.running=false;state.paused=false;state.selectedFollow=null;renderer.setMode('auto');setScreen('preview')}
function launch(){state.simMode='race';state.running=true;state.paused=false;state.started=false;state.countdown=3.65;state.finishShowing=false;state.lastHUD=-1;state.selectedFollow=null;renderer.setMode('auto');setScreen('racing');beep(520)}
function raceFinished(){if(state.finishShowing)return;state.finishShowing=true;state.running=false;let w=state.world;let today=new Date().toLocaleDateString('en-CA');let bonus=save.lastBonus===today?0:25;let award=20+(bonus||0)+15;save.coins+=award;w.coinsEarned=award;save.lastBonus=today;save.stats.races++;if(state.mode==='ffa'||state.mode==='pachinko')save.stats.wins++;let winner=w.marbles.find(b=>b.place===1);if(winner?.time!=null)save.stats.bestTime=save.stats.bestTime==null?winner.time:Math.min(save.stats.bestTime,winner.time);persist();beep(610,.2);setTimeout(()=>beep(790,.2),140);setScreen('results')}
function updateHUD(){let w=state.world;if(!w)return;let time=$('#timer');if(time)time.textContent=formatTime(w.time);let st=$('#race-status');if(st)st.textContent=state.countdown>0?'GET READY':`${w.finishOrder.length} FINISHED`;let fin=$('#finished-count');if(fin)fin.textContent=`${w.finishOrder.length} / ${w.marbles.length} FINISHED`;let rows=$('#leader-rows');if(rows)rows.innerHTML=leaderboardRows(w);let counter=$('#countdown');if(counter)counter.textContent=state.countdown>.6?Math.ceil(state.countdown-.6):'GO!';if(state.countdown<=0&&counter)counter.remove()}
function handle(action,data={}){switch(action){case 'home':makeDemo();setScreen('home');break;case 'setup':if(state.simMode==='race'&&state.screen!=='results'){makeDemo()}setScreen('setup');break;case 'roster':setScreen('roster');break;case 'preview':racePreview();break;case 'regen':racePreview();break;case 'launch':launch();break;case 'mode':state.mode=data.value;setScreen('setup');break;case 'teams':state.teams=+data.value;state.players.forEach((p,i)=>p.team=i%state.teams);setScreen('setup');break;case 'length':state.length=data.value;setScreen('setup');break;case 'course':if(!save.unlockedCourses.includes(data.value)){toast('Unlock this course in the Marble Market first.');return}state.course=data.value;setScreen('setup');break;case 'shop':state.shopTab='marbles';setScreen('shop');break;case 'shoptab':state.shopTab=data.value;setScreen('shop');break;case 'buy':{let isSkin=data.type==='skin',item=(isSkin?SKINS:COURSES).find(x=>x.id===data.value);if(!item)return;let arr=isSkin?save.unlockedSkins:save.unlockedCourses;if(arr.includes(item.id)){toast('Already unlocked!');return}if(save.coins<item.cost){toast(`Need ${item.cost-save.coins} more coins for ${item.title}.`);return}save.coins-=item.cost;arr.push(item.id);persist();setScreen('shop');toast(`Unlocked ${item.title}!`);beep(880);break}case 'records':setScreen('records');break;case 'settings':setScreen('settings');break;case 'camera':state.selectedFollow=null;renderer.setMode('auto');updateHUD();break;case 'sound':save.sound=!save.sound;persist();renderUI();break;case 'pause':state.paused=true;showPause();break;case 'resume':state.paused=false;$('#pause-shade')?.remove();break;case 'rematch':racePreview();break}}
function showPause(){let d=document.createElement('div');d.id='pause-shade';d.className='paused-shade';d.innerHTML=`<div class="paused-card"><h2>Ⅱ &nbsp; PAUSED</h2><p class="hint">Your marbles are taking a breather.</p>${btn('▶ RESUME RACE','resume','primary lg')}${btn('QUIT TO HOME','home','ghost')}</div>`;overlay.appendChild(d)}

// Renderer lifecycle: fixed-step 60 Hz simulation, animation decoupled from physics.

if(state.simMode==='race'&&!state.paused&&state.countdown>0){let old=Math.ceil(state.countdown-.6);state.countdown-=dt;let next=Math.ceil(state.countdown-.6);if(next!==old){beep(next<=0?870:490+(3-next)*95,next<=0?.22:.08)}if(state.countdown<=0){state.countdown=0;state.started=true}}
